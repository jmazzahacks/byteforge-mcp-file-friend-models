[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "byteforge-mcp-file-friend-models"
version = "0.0.1"
description = "Shared File Friend data contracts and validation"
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Jason Byteforge"}]
dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/byteforge_mcp_file_friend_models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--confcutdir=."

[tool.ruff]
line-length = 110

[tool.uv]
exclude-newer = "7 days"
